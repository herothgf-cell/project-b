<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>콘텐츠 설정 관리</title><link rel="stylesheet" href="/style.css"></head><body><header><div><p class="eyebrow">EUNGYE TAXI · CONTENT</p><h1>콘텐츠 설정 관리</h1><p>승객과 대화, 게임 효과를 한곳에서 조정합니다.</p></div><div class="header-status"><strong id="profileName">불러오는 중</strong><span id="changeCount"></span></div></header><div class="notice" id="status" role="status">설정을 불러오는 중입니다.</div><main><aside><h2>분류</h2><nav id="tabs"></nav><div class="side-note">저장한 설정은 게임에 적용한 뒤 <strong>다음 새 싱글 캠페인 또는 새 PVP 방</strong>부터 사용합니다. 이어하기는 저장 당시 설정을 유지합니다.</div></aside><section class="list-pane"><div class="section-head"><div><p class="eyebrow">상황 탐색</p><h2 id="groupTitle">전체 설정</h2></div><span id="itemCount"></span></div><label class="search"><span>검색</span><input id="search" type="search" placeholder="상황, 대사, 선택지, 효과 검색"></label><div class="filters"><label>상태 <select id="filter"><option value="all">전체</option><option value="changed">변경됨</option><option value="editable">편집 가능</option><option value="reference">참조</option></select></label><label>모드 <select id="mode"><option value="all">전체</option><option value="single">싱글</option><option value="pvp">PVP</option></select></label><label>구현 <select id="impl"><option value="all">전체</option><option value="implemented">구현</option><option value="partial">부분</option><option value="planned">기획</option></select></label><label>사용 <select id="enabled"><option value="all">전체</option><option value="true">사용</option><option value="false">제외</option></select></label><label>영향 <select id="effect"><option value="all">전체</option><option value="만족">만족도</option><option value="청결">청결</option><option value="시간">시간</option><option value="운임">운임</option><option value="법규">법규 점수</option></select></label></div><div id="items" class="items"></div></section><section class="detail-pane"><div id="detail" class="detail empty">목록에서 항목을 선택하면 자세한 내용과 편집값을 볼 수 있습니다.</div></section></main><footer><div class="actions"><button id="new">새 프로필</button><button id="load">불러오기</button><button id="reset">기본값으로</button><button id="import">가져오기</button><button id="export">내보내기</button><button id="validate">검증</button><button id="save" class="primary">저장</button><button id="apply" class="accent">게임에 적용</button></div><details class="footer-extra"><summary>미리보기·테스트 및 적용 상태</summary><details class="sample"><summary>미리보기 입력 조정</summary><div class="sample-fields"><label>기본 운임 <input id="sampleFare" type="number" value="5000"></label><label>운전 만족도 M <input id="sampleManner" type="number" value="100"></label><label>요구 만족도 <input id="sampleRequired" type="number" value="70"></label><label>청결 가산(시작값에 포함) <input id="sampleClean" type="number" value="0"></label></div><small>정산(요청 변화 0), 요청 이행 점수, 법규 사건을 각각 계산합니다.</small></details><div class="actions secondary"><button id="preview">샘플 계산 미리보기</button><button id="test">분리 테스트 실행</button><span id="activeStatus"></span></div></details></footer><input id="file" type="file" accept="application/json,.json" hidden><dialog id="questionDialog" aria-labelledby="questionMessage"><div class="question-body"><p id="questionMessage"></p><label id="questionLabel" for="questionInput"></label><input id="questionInput" type="text" autocomplete="off"><div class="question-actions"><button id="questionCancel" type="button">취소</button><button id="questionOk" type="button" class="primary">확인</button></div></div></dialog><dialog id="result"><div class="dialog-head"><h2 id="resultTitle"></h2><button id="closeResult">닫기</button></div><pre id="resultText"></pre></dialog><script src="/passenger-presets.js" defer></script><script src="/content-model.js" defer></script><script src="/app.js" defer></script></body></html>
